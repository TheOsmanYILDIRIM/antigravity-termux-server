name: Server Syntax & Bridge Checks

concurrency:
  group: server-quality-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feature/chatgpt-agent-bridge
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check server syntax
        run: |
          node --check server.js
          node --check lib/actions.js
          node --check scripts/run-action.js

      - name: Check bridge relay syntax
        run: node --check bridge/relay.js

      - name: Check shell scripts
        run: |
          bash -n bin/agy-web
          bash -n bin/agy-update
          bash -n bin/agy-action-run
          bash -n install.sh

      - name: Validate external action catalog
        run: node scripts/validate-actions.js
