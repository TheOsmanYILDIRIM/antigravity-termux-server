name: Server Syntax & Bridge Checks

on:
  push:
    branches:
      - main
      - feature/chatgpt-agent-bridge
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check server syntax
        run: node --check server.js

      - name: Check bridge relay syntax
        run: node --check bridge/relay.js

      - name: Check shell scripts
        run: |
          bash -n bin/agy-web
          bash -n bin/agy-update
          bash -n install.sh

      - name: Validate action manifest example
        run: node -e "JSON.parse(require('fs').readFileSync('actions.json.example','utf8')); console.log('actions.json.example OK')"
